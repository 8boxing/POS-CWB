<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS-CWB 收銀系統</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2c3e50; }
  header { background: #2c3e50; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; }
  #loginBox { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 999; }
  #loginBox .card { background: #fff; padding: 24px; border-radius: 10px; width: 320px; }
  #loginBox input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
  #loginBox button { width: 100%; padding: 10px; background: #3498db; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .toolbar { padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  .toolbar button { padding: 12px 20px; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-size: 14px; }
  .btn-exp { background: #e67e22; } .btn-pay { background: #27ae60; } .btn-void { background: #c0392b; } .btn-order { background: #2980b9; }
  .status { padding: 0 20px; color: #7f8c8d; font-size: 13px; }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.show { display: flex; }
  .modal .box { background: #fff; border-radius: 12px; width: 95%; max-width: 1100px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
  .modal .head { padding: 14px 20px; background: #2c3e50; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  .modal .head .close { cursor: pointer; font-size: 22px; }
  .modal .filters { padding: 14px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #eee; }
  .modal .filters input[type="date"],
  .modal .filters input[type="text"],
  .modal .filters button { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  .modal .filters button { background: #3498db; color: #fff; border: none; cursor: pointer; }
  .modal .body { padding: 10px 20px; overflow-y: auto; }
  table { width: 200%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #f0f2f5; position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { background: #e2e6ea; }
  th .arrow { color: #3498db; font-size: 11px; }
  td input width:max-content { padding: 6px; border: 1px solid #ddd; border-radius: 4px; }
  .row-actions button { padding: 4px 8px; margin: 0 2px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
  .btn-save { background: #27ae60; } .btn-del { background: #c0392b; }
  tr.selected { background: #fff9e6; }
  tr.selected td { background: #fff3cd; }
  .chk { width: 18px; height: 18px; cursor: pointer; }
  .summary { padding: 10px 20px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; font-size: 14px; }
  .summary b { color: #c0392b; font-size: 16px; }
  .modal .foot { padding: 12px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
  .modal .foot button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; color: #fff; }
  .btn-add { background: #8e44ad; } .btn-refresh { background: #95a5a6; }
  .btn-cash { background: #16a085; }

  /* ★ 彈窗加寬 300px (1100 + 300 = 1400) */
  .modal .box { max-width: 1400px; }

</style>
</head>
<body>

<header>
  <h1>🏪 POS-CWB 收銀系統 v2.0</h1>
  <span id="userInfo"></span>
</header>

<!-- 登入框 -->
<div id="loginBox">
  <div class="card">
    <h2 style="margin-bottom:8px;">登入</h2>
    <input id="lgEmail" type="email" placeholder="Email">
    <input id="lgPwd" type="password" placeholder="密碼">
    <button onclick="posLogin()">登入</button>
  </div>
</div>

<!-- 主工具列 -->
<div class="toolbar">
  <button class="btn-exp" onclick="openModal('expenses')">💸 支出 Expenses</button>
  <button class="btn-pay" onclick="openModal('pay_records')">💰 收款 Pay Records</button>
  <button class="btn-void" onclick="openModal('void_records')">🚫 作廢 Void Records</button>
  <button class="btn-order" onclick="openModal('order_item')">🛒 明細 Order Items</button>
  <button class="btn-cash" onclick="calcCashBalance()">💵 現金結餘 Cash Balance</button>
</div>
<div class="status" id="status">就緒</div>

<!-- 通用 Modal -->
<div class="modal" id="modal">
  <div class="box">
    <div class="head">
      <span id="modalTitle">查詢</span>
      <span class="close" onclick="closeModal()">&times;</span>
    </div>
    <div class="filters">
      <label>從 <input type="date" id="fStart"></label>
      <label>到 <input type="date" id="fEnd"></label>
      <label>🔍 搜尋 <input type="text" id="fSearch" placeholder="模糊搜尋..."></label>
      <button onclick="loadData()">🔍 查詢</button>
      <button class="btn-refresh" onclick="loadData()">↻ 重新整理</button>
      <button onclick="clearSelection()" style="background:#95a5a6;">✖ 取消選取</button>
    </div>
    <div class="body">
      <table id="grid">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="summary">
      <span>總筆數：<b id="sumCount">0</b></span>
      <span>搜尋結果總金額：<b id="sumTotal">0.00</b></span>
      <span>已選取筆數：<b id="selCount">0</b></span>
      <span>已選取總金額：<b id="selTotal">0.00</b></span>
    </div>
    <div class="foot">
      <button class="btn-add" onclick="addRow()">➕ 新增一筆</button>
      <span id="rowCount"></span>
    </div>
  </div>
</div>
<script>
/* ===== Supabase 客戶端（請改成你自己的）===== */
const SB_URL = 'https://hictckzamrshdbajaafg.supabase.co';
const SB_KEY = 'sb_publishable_KP1vgmWGdI2PF9Pb_yjQOg_LWjyC6vv';
const sb = supabase.createClient(SB_URL, SB_KEY, {
  auth: { persistSession: true, storage: window.localStorage }
});

/* ===== 各表欄位設定（可依你的實際表格調整）=====
   cols: 顯示欄位
   editable: 可編輯欄
   defaults: 新增時預設值
   amountCol: 用來計算「總金額」的欄位（每個模組自行定義）
   searchCols: 模糊搜尋要對照的欄位（需求 5）
================================================ */
const TABLES = {
  expenses: {
    label: '💸 支出查詢',
    cols: ['id','created_at','category','reason','amount','note','shop_mk'],
    editable: ['category','reason','amount','note','shop_mk'],
    defaults: { category:'雜費', reason:'', amount:0, note:'', shop_mk:'cwb' },
    amountCol: 'amount',
    searchCols: ['reason']
  },
  pay_records: {
    label: '💰 收款查詢',
    cols: ['id','order_id', 'pay_type', 'amount', 'shop_mk','created_at'],
    editable: ['pay_type','amount','shop_mk'],
    defaults: { pay_type:'Cash', amount:0, order_id:'', shop_mk:'cwb' },
    amountCol: 'amount',
    searchCols: ['pay_type']
  },
  void_records: {
    label: '🚫 作廢查詢',
    cols: ['id','order_id', 'refund_method','remark','amount','operator', 'created_at', 'shop_mk'],
    editable: ['refund_method','remark','amount','operator','shop_mk'],
    defaults: { refund_method:'Cash', remark:'客戶取消', amount:0, operator:'', shop_mk:'cwb' },
    amountCol: 'amount',
    searchCols: ['refund_method']
  },
  order_item: {
    label: '🛒 明細查詢',
    cols: ['id','order_id','product_id','product_name','barcode','qty','single_price','discount','created_at','shop_mk'],
    editable: ['order_id','product_id','product_name','barcode','qty','single_price','discount','shop_mk'],
    defaults: { order_id:'', product_id:'', product_name:'', barcode:'', qty:1, single_price:0, discount:0, shop_mk:'cwb' },
    amountCol: 'single_price',
    searchCols: ['product_name','barcode']
  }
};

let CURRENT = null;
let ALL_ROWS = [];
let SORT = { col: null, dir: 'asc' };
let SELECTED = new Set();

/* ===== 自動登入 / Session 還原 ===== */
window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('userInfo').textContent = session.user.email;
  }
});

async function posLogin() {
  const email = document.getElementById('lgEmail').value.trim();
  const pwd = document.getElementById('lgPwd').value;
  if (!email || !pwd) { alert('請輸入帳號密碼'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) { alert('登入失敗：' + error.message); return; }
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('userInfo').textContent = data.session.user.email;
}

/* ===== 彈窗控制 ===== */
function openModal(name) {
  CURRENT = name;
  SELECTED = new Set();
  SORT = { col: null, dir: 'asc' };
  document.getElementById('modalTitle').textContent = TABLES[name].label;
  document.getElementById('modal').classList.add('show');
  const today = new Date();
  document.getElementById('fStart').value = toDateInput(new Date(today.setHours(0,0,0,0)));
  document.getElementById('fEnd').value = toDateInput(new Date());
  document.getElementById('fSearch').value = '';
  buildHeader();
  loadData();
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
  CURRENT = null;
}
function toDateInput(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function buildHeader() {
  const cols = TABLES[CURRENT].cols;
  document.querySelector('#grid thead').innerHTML =
    '<tr><th><input type="checkbox" class="chk" onclick="toggleSelectAll(this)"></th>'
    + cols.map(c => `<th onclick="sortBy('${c}')">${c} <span class="arrow"></span></th>`).join('')
    + '<th>操作</th></tr>';
}

/* ===== 讀取（依日期查詢 + 模糊搜尋）===== */
async function loadData() {
  if (!CURRENT) return;
  setStatus('讀取中...');
  const cfg = TABLES[CURRENT];
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const keyword = (document.getElementById('fSearch').value || '').trim();

  const { data: { user }, error: authErr } = await sb.auth.getUser();
  if (authErr || !user) { alert('⚠️ 請先登入'); closeModal(); return; }

  // ★ 所有查詢強制只抽 shop_mk = 'cwb'，避免混入其他分店資料
  let query = sb.from(CURRENT).select('*').eq('shop_mk', 'cwb');
  if (start) query = query.gte('created_at', start + 'T00:00:00.000Z');
  if (end) {
    const nextDay = new Date(end + 'T00:00:00.000Z');
    nextDay.setDate(nextDay.getDate() + 1);
    query = query.lt('created_at', nextDay.toISOString());
  }

  const { data, error } = await query;
  if (error) { setStatus('查詢失敗：' + error.message); return; }

  let rows = data || [];
  if (keyword) {
    const k = keyword.toLowerCase();
    rows = rows.filter(r => cfg.searchCols.some(col => {
      const v = r[col];
      return v != null && String(v).toLowerCase().includes(k);
    }));
  }

  ALL_ROWS = rows;
  applySortAndRender();
  setStatus(`共 ${rows.length} 筆`);
}

/* ===== 排序 ===== */
function sortBy(col) {
  if (SORT.col === col) {
    SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
  } else {
    SORT.col = col;
    SORT.dir = 'asc';
  }
  applySortAndRender();
}
function applySortAndRender() {
  let rows = ALL_ROWS.slice();
  if (SORT.col) {
    rows.sort((a, b) => {
      const av = a[SORT.col], bv = b[SORT.col];
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === 'number' && typeof bv === 'number') {
        return SORT.dir === 'asc' ? av - bv : bv - av;
      }
      const cmp = String(av).localeCompare(String(bv));
      return SORT.dir === 'asc' ? cmp : -cmp;
    });
  }
  renderRows(rows);
  document.querySelectorAll('#grid thead .arrow').forEach(el => el.textContent = '');
  const idx = TABLES[CURRENT].cols.indexOf(SORT.col);
  if (idx >= 0 && SORT.col) {
    document.querySelectorAll('#grid thead .arrow')[idx].textContent = SORT.dir === 'asc' ? '▲' : '▼';
  }
}

/* ===== 渲染表格 ===== */
function renderRows(rows) {
  const cols = TABLES[CURRENT].cols;
  const tbody = document.querySelector('#grid tbody');
  tbody.innerHTML = rows.map((r) => {
    const cells = cols.map(c => {
      const val = r[c] ?? '';
      return TABLES[CURRENT].editable.includes(c)
        ? `<td><input data-id="${r.id}" data-col="${c}" value="${val}"></td>`
        : `<td>${typeof val === 'object' ? JSON.stringify(val) : val}</td>`;
    }).join('');
    const checked = SELECTED.has(r.id) ? 'checked' : '';
    return `<tr class="${SELECTED.has(r.id) ? 'selected' : ''}" data-id="${r.id}">`
      + `<td><input type="checkbox" class="chk" ${checked} onclick="toggleSelect('${r.id}', this)"></td>`
      + cells
      + `<td class="row-actions">
          <button class="btn-save" onclick="saveRow('${r.id}')">💾</button>
          <button class="btn-del" onclick="deleteRow('${r.id}')">🗑</button>
        </td></tr>`;
  }).join('');
  updateSummary();
}

/* ===== 多選 ===== */
function toggleSelect(id, checkbox) {
  if (checkbox.checked) SELECTED.add(id);
  else SELECTED.delete(id);
  const tr = document.querySelector(`#grid tr[data-id="${id}"]`);
  if (tr) tr.classList.toggle('selected', checkbox.checked);
  updateSummary();
}
function toggleSelectAll(master) {
  const checkboxes = document.querySelectorAll('#grid tbody .chk');
  checkboxes.forEach(cb => {
    const tr = cb.closest('tr');
    const id = tr.dataset.id;
    cb.checked = master.checked;
    if (master.checked) SELECTED.add(id);
    else SELECTED.delete(id);
    tr.classList.toggle('selected', master.checked);
  });
  updateSummary();
}
function clearSelection() {
  SELECTED = new Set();
  document.querySelectorAll('#grid .chk').forEach(cb => cb.checked = false);
  document.querySelectorAll('#grid tbody tr').forEach(tr => tr.classList.remove('selected'));
  updateSummary();
}

/* ===== 總金額計算 ===== */
function updateSummary() {
  const cfg = TABLES[CURRENT];
  const amountCol = cfg.amountCol;
  const allTotal = ALL_ROWS.reduce((s, r) => s + (Number(r[amountCol]) || 0), 0);
  const selTotal = ALL_ROWS
    .filter(r => SELECTED.has(r.id))
    .reduce((s, r) => s + (Number(r[amountCol]) || 0), 0);

  document.getElementById('sumCount').textContent = ALL_ROWS.length;
  document.getElementById('sumTotal').textContent = formatMoney(allTotal);
  document.getElementById('selCount').textContent = SELECTED.size;
  document.getElementById('selTotal').textContent = formatMoney(selTotal);
}
function rowAmount(r) {
  const cfg = TABLES[CURRENT];
  if (CURRENT === 'order_item') {
    return (Number(r.qty) || 0) * (Number(r.single_price) || 0) - (Number(r.discount) || 0);
  }
  return Number(r[cfg.amountCol]) || 0;
}
function formatMoney(n) { return Number(n).toLocaleString('zh-Hant', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

/* ===== 新增一列 ===== */
function addRow() {
  const cols = TABLES[CURRENT].cols;
  const def = TABLES[CURRENT].defaults;
  const tbody = document.querySelector('#grid tbody');
  const id = 'NEW_' + Date.now();
  const cells = cols.map(c => {
    const val = def[c] ?? '';
    return `<td><input data-id="${id}" data-col="${c}" value="${val}"></td>`;
  }).join('');
  tbody.insertAdjacentHTML('afterbegin', `<tr data-id="${id}"><td></td>${cells}
    <td class="row-actions"><button class="btn-save" onclick="saveRow('${id}')">💾 新增</button></td></tr>`);
}

/* ===== 寫入 / 更新 ===== */
async function saveRow(id) {
  const inputs = document.querySelectorAll(`#grid input[data-id="${id}"]`);
  const cfg = TABLES[CURRENT];
  const payload = {};

  inputs.forEach(inp => {
    const col = inp.dataset.col;
    if (!cfg.cols.includes(col)) return;
    let val = inp.value;
    if (['qty','single_price','discount','amount','change_amount'].includes(col)) {
      val = val === '' ? 0 : Number(val);
    }
    payload[col] = val;
  });

  // ★ 所有寫入一律帶上 shop_mk = 'cwb'，確保資料歸屬 CWB 分店
  payload.shop_mk = 'cwb';
  if (!payload.created_at) payload.created_at = new Date().toISOString();

  if (CURRENT === 'order_item' && !String(payload.order_id || '').trim()) {
    alert('⚠️ order_id 不可為空');
    return;
  }

  setStatus('儲存中...');
  let res;
  if (String(id).startsWith('NEW_')) {
    const insertPayload = { ...payload };
    delete insertPayload.id;
    res = await sb.from(CURRENT).insert([insertPayload]).select();
  } else {
    const updatePayload = { ...payload };
    delete updatePayload.created_at;
    res = await sb.from(CURRENT).update(updatePayload).eq('id', id).select();
  }

  if (res.error) { setStatus('儲存失敗：' + res.error.message); alert('儲存失敗：' + res.error.message); return; }
  setStatus('✅ 已儲存');
  loadData();
}

/* ===== 刪除 ===== */
async function deleteRow(id) {
  if (!confirm('確定刪除這筆？')) return;
  const res = await sb.from(CURRENT).delete().eq('id', id);
  if (res.error) { setStatus('刪除失敗：' + res.error.message); return; }
  SELECTED.delete(id);
  setStatus('🗑 已刪除');
  loadData();
}

/* ===== 現金結餘（全部歷史，只算 shop_mk = 'cwb'）=====
   結餘 = SUM(pay_records.pay_type='Cash') - SUM(void_records.refund_method='Cash') - SUM(expenses)
   三張表都只抽 cwb，不混入其他分店
================================================ */
async function calcCashBalance() {
  setStatus('計算現金結餘...');

  const { data: { user }, error: authErr } = await sb.auth.getUser();
  if (authErr || !user) { alert('⚠️ 請先登入'); return; }

  const [{ data: pays }, { data: voids }, { data: exps }] = await Promise.all([
    sb.from('pay_records').select('amount').eq('shop_mk', 'cwb').eq('pay_type', 'Cash'),
    sb.from('void_records').select('amount').eq('shop_mk', 'cwb').eq('refund_method', 'Cash'),
    sb.from('expenses').select('amount').eq('shop_mk', 'cwb')
  ]);

  const sum = (arr) => (arr || []).reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const payTotal  = sum(pays);
  const voidTotal = sum(voids);
  const expTotal  = sum(exps);
  const balance   = payTotal - voidTotal - expTotal;

  alert(
    `💵 CWB 現金結餘\n\n` +
    `收款 Cash (+): ${formatMoney(payTotal)}\n` +
    `退款 Cash (-): ${formatMoney(voidTotal)}\n` +
    `支出 All    (-): ${formatMoney(expTotal)}\n` +
    `${'─'.repeat(28)}\n` +
    `結餘: ${formatMoney(balance)}`
  );
  setStatus(`現金結餘：${formatMoney(balance)}`);
}

function setStatus(t){ document.getElementById('status').textContent = t; }
</script>
</body>
</html>
